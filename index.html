<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRONO PILOT</title>
<style>
  :root {
    --frame: #0b1622;
    --ink: #cfe3ff;
    --dim: #6f89a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #16263a 0%, #060b12 70%);
    color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  #stage {
    position: relative;
    line-height: 0;
    border: 2px solid #24405e;
    border-radius: 6px;
    box-shadow: 0 0 0 1px #060b12, 0 18px 40px rgba(0, 0, 0, .6);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: min(96vw, calc((100vh - 130px) * 4 / 3));
    height: auto;
    image-rendering: auto;
    background: #0a1a2c;
    touch-action: none;
  }
  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    justify-content: center;
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--dim);
  }
  footer b { color: var(--ink); font-weight: 700; }
  footer .hint { color: #4f637d; }
  noscript { color: #ff8f8f; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="960" height="720" aria-label="Chrono Pilot game screen"></canvas>
  </div>
  <footer>
    <span><b>&#8592;&#8593;&#8595;&#8594; / WASD</b> turn</span>
    <span><b>SPACE / Z</b> fire</span>
    <span><b>ENTER</b> start</span>
    <span><b>P</b> pause</span>
    <span><b>M</b> mute</span>
    <span class="hint">画面をクリックしてからキー操作</span>
  </footer>
  <noscript>This game requires JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
